[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

# Statically link libstdc++/libgcc/libwinpthread so the built session_tracker.dll
# has zero MinGW-runtime-DLL dependencies (only stock Windows system DLLs).
# Without this, Nexus's loader fails LoadLibrary on the addon (reported as
# addon state "NotLoadedIncompatible") because libstdc++-6.dll (needed by
# arcdps-imgui's vendored C++ code for __cxa_guard_acquire/release) isn't
# present on a normal Windows install.
#
# Plain `-static-libgcc -static-libstdc++` isn't enough: rustc's own default
# link template inserts a `-Wl,-Bdynamic` before the system-libs section, so
# a bare `-static` flag placed later in `-C link-args` doesn't retroactively
# take effect. We must explicitly reopen `-Wl,-Bstatic` right before our own
# group. `--start-group`/`--end-group` resolves the circular references
# between libstdc++/libgcc/libwinpthread; `-Wl,-Bdynamic` afterward restores
# dynamic linking for msvcrt/mingwex/kernel32 (which have no true static
# archives available — they're always-present system/CRT components anyway,
# so dynamic linkage for those is fine).
rustflags = ["-C", "link-args=-Wl,-Bstatic -Wl,--start-group -lstdc++ -lwinpthread -lgcc -lgcc_eh -Wl,--end-group -Wl,-Bdynamic -lmsvcrt -lmingwex -lkernel32"]

# arcdps-imgui-sys's build script (via the `cc` crate) otherwise emits its
# own dynamic `cargo:rustc-link-lib=stdc++`, which resolves libstdc++-6.dll
# dynamically regardless of the flags above. Suppressing the cc crate's
# automatic C++ stdlib link (empty CXXSTDLIB) makes our own static -lstdc++
# above the only source of that symbol.
[env]
CXXSTDLIB = ""
