name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"

env:
  CARGO_TERM_COLOR: always

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # ratchet:dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # ratchet:Swatinem/rust-cache@v2
      # session_tracker (the addon crate) depends on Windows-only APIs and
      # can't build for the native runner target at all - only
      # session_tracker_core/session_tracker_net are exercised here. The
      # addon crate itself is covered by the windows cross-compile job below.
      - name: cargo test
        run: cargo test --locked -p session_tracker_core -p session_tracker_net
      - name: cargo clippy
        run: cargo clippy --locked -p session_tracker_core -p session_tracker_net --all-targets -- -D warnings

  build-windows:
    name: Build addon (x86_64-pc-windows-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # ratchet:dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          # Ubuntu ships both win32- and posix-threading-model mingw-w64
          # variants via update-alternatives. The win32 variant (the
          # default) is missing symbols (e.g. __mingwthr_key_dtor) that
          # our static -lwinpthread/-lgcc linking in .cargo/config.toml
          # needs - select posix explicitly.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # ratchet:Swatinem/rust-cache@v2
      - name: cargo build (release)
        run: cargo build --locked --target x86_64-pc-windows-gnu --release -p session_tracker
