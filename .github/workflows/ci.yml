name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"

env:
  CARGO_TERM_COLOR: always

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (native)
    runs-on: ubuntu-latest
    env:
      GW2_API_KEY: ${{ secrets.GW2_API_KEY }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.guildwars2.com:443
            github.com:443
            index.crates.io:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # ratchet:step-security/dtolnay-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # ratchet:Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --locked -p session_tracker_core -p session_tracker_net
      - name: cargo test (live GW2 API)
        if: ${{ env.GW2_API_KEY != '' }}
        run: cargo test --locked -p session_tracker_net --test live_api -- --ignored
      - name: cargo clippy
        run: cargo clippy --locked -p session_tracker_core -p session_tracker_net --all-targets -- -D warnings
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # ratchet:taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - name: cargo deny check
        run: cargo deny check
      - name: cargo machete
        run: cargo machete

  build-windows:
    name: Build addon (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # ratchet:step-security/dtolnay-rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: step-security/rust-cache@8871c8ba063416da7c32246932ea6ae08700453e # ratchet:step-security/rust-cache@v2
      - name: cargo build (release)
        run: cargo build --locked --target x86_64-pc-windows-msvc --release -p session_tracker
