name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  build-windows:
    name: Build and publish release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # ratchet:step-security/dtolnay-rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: step-security/rust-cache@851174d9a2fdc03e0896e02844dcc61d81dd7851 # ratchet:step-security/rust-cache@v2
      - name: cargo build (release)
        run: cargo build --locked --target x86_64-pc-windows-msvc --release -p session_tracker
      - name: Create release with DLL attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes target/x86_64-pc-windows-msvc/release/session_tracker.dll
