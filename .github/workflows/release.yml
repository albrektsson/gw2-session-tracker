name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  build-windows:
    name: Build and publish release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # ratchet:step-security/dtolnay-rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: step-security/rust-cache@851174d9a2fdc03e0896e02844dcc61d81dd7851 # ratchet:step-security/rust-cache@v2
      - name: cargo build (release)
        run: cargo build --locked --target x86_64-pc-windows-msvc --release -p session_tracker
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # ratchet:taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Generate release notes
        # Most commits land directly on main rather than through PRs, so
        # `gh release create --generate-notes` (which only categorizes
        # merged PRs) has nothing to work with - git-cliff builds notes
        # from the raw commit log instead (see cliff.toml).
        run: git-cliff --latest --tag "${{ github.ref_name }}" --output release-notes.md
      - name: Create release with DLL attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --notes-file release-notes.md target/x86_64-pc-windows-msvc/release/session_tracker.dll
